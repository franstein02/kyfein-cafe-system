# Nginx HTTPS & WebSocket Configuration for Kyfein Cafe System
# Domain Target: kasir.<domain> (e.g., kasir.cafe-kyfein.com)
# Environment: Windows PC Server (Laragon / Standalone Nginx)

# 1. HTTP Server - Redirect 80 -> 443 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kasir.cafe-kyfein.com kasir.yourdomain.com; # Ganti dengan domain cafe Anda

    # Redirect seluruh lalu lintas HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Main Application (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kasir.cafe-kyfein.com kasir.yourdomain.com; # Ganti dengan domain cafe Anda

    # Path Sertifikat Let's Encrypt dari win-acme
    ssl_certificate     "C:/ProgramData/win-acme/https-kasir/kasir.cafe-kyfein.com-crt.pem";
    ssl_certificate_key "C:/ProgramData/win-acme/https-kasir/kasir.cafe-kyfein.com-key.pem";

    # SSL Security & Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Kapasitas maksimal body request (Minimal 6M, diset 10M untuk upload foto absensi & bukti QRIS)
    client_max_body_size 10M;

    # Root Directory untuk Build Output Flutter Web SPA
    root "C:/laragon/www/kyfein-web";
    index index.html;

    # Serve Flutter Web Single Page Application (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy REST API Traffic to FastAPI Backend (Uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings for REST API
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Reverse Proxy WebSocket Connection for KDS (Kitchen Display System)
    # WSS Endpoint: wss://kasir.<domain>/api/v1/kds/ws/{area_produksi}
    location /api/v1/kds/ws/ {
        proxy_pass http://127.0.0.1:8000/api/v1/kds/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keeping WebSocket connections alive without timeout drops
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
